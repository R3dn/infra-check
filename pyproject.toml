[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-check"
version = "1.0.0"
description = "Infrastructure health checker CLI: DNS, TCP, TLS, HTTP, certificate and latency checks in one command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Redn Alsidrah" }]
keywords = ["healthcheck", "dns", "tls", "certificate", "latency", "devops", "sre", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/R3dn/infra-check"
Repository = "https://github.com/R3dn/infra-check"
Issues = "https://github.com/R3dn/infra-check/issues"
Changelog = "https://github.com/R3dn/infra-check/blob/main/CHANGELOG.md"

[project.scripts]
infra-check = "infra_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infra_check"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/infra_check"]
